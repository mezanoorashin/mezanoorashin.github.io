<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas=document.getElementById('webgl');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);camera.position.z=7;

const earthGroup=new THREE.Group();
earthGroup.position.set(2.45,0.05,0);
earthGroup.scale.setScalar(1.62);
scene.add(earthGroup);

scene.add(new THREE.AmbientLight(0xffffff,.24));
const sun=new THREE.DirectionalLight(0xffffff,3.2);sun.position.set(-4,2.5,5);scene.add(sun);
const rim=new THREE.PointLight(0x168dff,28,15);rim.position.set(4,-1,4);scene.add(rim);

const loader=new THREE.TextureLoader();
const earthMap=loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
const earth=new THREE.Mesh(new THREE.SphereGeometry(1.5,80,80),new THREE.MeshPhongMaterial({map:earthMap,shininess:32}));
earthGroup.add(earth);

const cloudMap=loader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png');
const clouds=new THREE.Mesh(new THREE.SphereGeometry(1.525,80,80),new THREE.MeshPhongMaterial({map:cloudMap,transparent:true,opacity:.52,depthWrite:false}));
earthGroup.add(clouds);

const glow=new THREE.Mesh(new THREE.SphereGeometry(1.63,80,80),new THREE.MeshBasicMaterial({color:0x39a9ff,transparent:true,opacity:.12,side:THREE.BackSide}));
earthGroup.add(glow);

// Star field with depth, drift and twinkle.
const starCount=2600, pos=new Float32Array(starCount*3);
for(let i=0;i<starCount;i++){pos[i*3]=(Math.random()-.5)*18;pos[i*3+1]=(Math.random()-.5)*11;pos[i*3+2]=(Math.random()-.5)*10-2;}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(pos,3));
const sm=new THREE.PointsMaterial({color:0xffffff,size:.018,transparent:true,opacity:.82,sizeAttenuation:true});
const stars=new THREE.Points(sg,sm);scene.add(stars);

const blueStars=new THREE.Points(sg.clone(),new THREE.PointsMaterial({color:0x66bfff,size:.012,transparent:true,opacity:.42,sizeAttenuation:true}));
blueStars.position.z=-2;scene.add(blueStars);

// Meteor streaks.
const meteorGroup=new THREE.Group();scene.add(meteorGroup);
for(let i=0;i<7;i++){
 const geo=new THREE.BufferGeometry();
 const x=(Math.random()-.5)*13,y=(Math.random()-.5)*7,z=-1-Math.random()*3,len=.35+Math.random()*.65;
 geo.setAttribute('position',new THREE.Float32BufferAttribute([x,y,z,x-len,y+len*.55,z],3));
 meteorGroup.add(new THREE.Line(geo,new THREE.LineBasicMaterial({color:0x78cfff,transparent:true,opacity:.8})));
}
let tx=0,ty=0;
addEventListener('pointermove',e=>{tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5});
let t=0;
function animate(){
 requestAnimationFrame(animate);t+=.01;
 earth.rotation.y+=.0018;clouds.rotation.y+=.00235;
 earthGroup.rotation.y+=(tx*.30-earthGroup.rotation.y)*.035;
 earthGroup.rotation.x+=(ty*.16-earthGroup.rotation.x)*.035;
 earthGroup.position.x+=(2.45+tx*.38-earthGroup.position.x)*.025;
 earthGroup.position.y+=(.05-ty*.16-earthGroup.position.y)*.025;
 stars.rotation.y+=.00013;blueStars.rotation.y-=.00006;
 sm.opacity=.72+Math.sin(t*1.6)*.12;
 meteorGroup.position.x=Math.sin(t*.22)*.035;
 renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('show')}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(x=>io.observe(x));
</script>
<script>
const canvas=document.getElementById('webgl');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
camera.position.z=7;

const earthGroup=new THREE.Group();
earthGroup.position.set(2.65,0.1,0);
earthGroup.scale.setScalar(1.55);
scene.add(earthGroup);

scene.add(new THREE.AmbientLight(0xffffff,.28));
const sun=new THREE.DirectionalLight(0xffffff,2.8);sun.position.set(-4,2,5);scene.add(sun);
const blueRim=new THREE.PointLight(0x168cff,22,14);blueRim.position.set(4,-2,4);scene.add(blueRim);

const loader=new THREE.TextureLoader();
const earthTexture=loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
const earth=new THREE.Mesh(
 new THREE.SphereGeometry(1.5,72,72),
 new THREE.MeshPhongMaterial({map:earthTexture,shininess:28})
);
earthGroup.add(earth);

const cloudsTexture=loader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png');
const clouds=new THREE.Mesh(
 new THREE.SphereGeometry(1.525,72,72),
 new THREE.MeshPhongMaterial({map:cloudsTexture,transparent:true,opacity:.48,depthWrite:false})
);
earthGroup.add(clouds);

const atmosphere=new THREE.Mesh(
 new THREE.SphereGeometry(1.64,72,72),
 new THREE.MeshBasicMaterial({color:0x4aa8ff,transparent:true,opacity:.12,side:THREE.BackSide})
);
earthGroup.add(atmosphere);

// Moving star field
const starCount=1700, positions=new Float32Array(starCount*3), sizes=new Float32Array(starCount), phases=new Float32Array(starCount);
for(let i=0;i<starCount;i++){
 positions[i*3]=(Math.random()-.5)*15;
 positions[i*3+1]=(Math.random()-.5)*9;
 positions[i*3+2]=(Math.random()-.5)*8-1;
 sizes[i]=Math.random()*.035+.008;
 phases[i]=Math.random()*Math.PI*2;
}
const starGeo=new THREE.BufferGeometry();
starGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));
starGeo.setAttribute('size',new THREE.BufferAttribute(sizes,1));
const starMat=new THREE.PointsMaterial({color:0xffffff,size:.022,transparent:true,opacity:.8,sizeAttenuation:true});
const stars=new THREE.Points(starGeo,starMat);
scene.add(stars);

// A second layer creates gentle parallax.
const farStars=stars.clone();
farStars.material=starMat.clone();
farStars.material.size=.012;
farStars.material.opacity=.45;
farStars.position.z=-2;
scene.add(farStars);

let targetX=0,targetY=0;
addEventListener('pointermove',e=>{
 targetX=(e.clientX/innerWidth-.5);
 targetY=(e.clientY/innerHeight-.5);
});

let time=0;
function animate(){
 requestAnimationFrame(animate);
 time+=.012;

 // Earth rotates continuously and follows the cursor with smooth 3D parallax.
 earth.rotation.y+=.0018;
 clouds.rotation.y+=.0024;
 earthGroup.rotation.y+=(targetX*.34-earthGroup.rotation.y)*.035;
 earthGroup.rotation.x+=(targetY*.18-earthGroup.rotation.x)*.035;
 earthGroup.position.x+=(2.65+targetX*.42-earthGroup.position.x)*.025;
 earthGroup.position.y+=(0.1-targetY*.18-earthGroup.position.y)*.025;

 // Stars drift and twinkle.
 stars.rotation.y+=.00012;
 stars.rotation.x+=.000025;
 farStars.rotation.y-=.00006;
 starMat.opacity=.68+Math.sin(time*1.7)*.12;
 farStars.material.opacity=.35+Math.sin(time*1.1+1)*.1;

 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('show')}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(x=>io.observe(x));
</script>
